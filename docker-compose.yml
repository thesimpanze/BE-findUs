version: "3.8"

services:
    # Application service
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: findmy-app
        working_dir: /var/www
        environment:
            - APP_ENV=local
            - APP_DEBUG=true
            # - APP_KEY=base64:kkV8v1R8m8t7k5n3m9p2q1r0s9t8u7v6w5x4y3z2a1b0c9d8e7f6g5h4i3j2k1
            - DB_CONNECTION=pgsql
            - DB_HOST=db
            - DB_PORT=5432
            - DB_DATABASE=findmy
            - DB_USERNAME=findmy_user
            - DB_PASSWORD=12345
            - REDIS_HOST=redis
            - REDIS_PASSWORD=null
            - REDIS_PORT=6379
        volumes:
            - .:/var/www
            - ./storage/logs:/var/www/storage/logs
        depends_on:
            - db
            - redis
        networks:
            - findmy-network

    # Nginx web server
    nginx:
        image: nginx:alpine
        container_name: findmy-nginx
        ports:
            - "80:80"
            - "8000:80"
            - "443:443"
        volumes:
            - .:/var/www
            - ./docker/nginx/conf.d:/etc/nginx/conf.d
            - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./storage/logs/nginx:/var/log/nginx
        depends_on:
            - app
        networks:
            - findmy-network

    # PostgreSQL Database
    db:
        image: postgres:16-alpine
        container_name: findmy-db
        environment:
            POSTGRES_DB: findmy
            POSTGRES_USER: findmy_user
            POSTGRES_PASSWORD: 12345
        ports:
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
        networks:
            - findmy-network
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U findmy_user -d findmy"]
            timeout: 20s
            retries: 10

    # Redis Cache
    redis:
        image: redis:7-alpine
        container_name: findmy-redis
        ports:
            - "6379:6379"
        volumes:
            - redisdata:/data
        networks:
            - findmy-network
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            timeout: 3s
            retries: 5

    # Adminer for database management
    adminer:
        image: adminer:latest
        container_name: findmy-adminer
        ports:
            - "8080:8080"
        depends_on:
            - db
        networks:
            - findmy-network

volumes:
    pgdata:
        driver: local
    redisdata:
        driver: local

networks:
    findmy-network:
        driver: bridge
