version: "3.8"

services:
    # Application service
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: findmy-app
        working_dir: /var/www
        environment:
            - APP_ENV=local
            - APP_DEBUG=true
            # - APP_KEY=base64:kkV8v1R8m8t7k5n3m9p2q1r0s9t8u7v6w5x4y3z2a1b0c9d8e7f6g5h4i3j2k1
            - DB_CONNECTION=mysql
            - DB_HOST=db
            - DB_PORT=3306
            - DB_DATABASE=findmy
            - DB_USERNAME=findmy_user
            - DB_PASSWORD=findmy_password
            - REDIS_HOST=redis
            - REDIS_PASSWORD=null
            - REDIS_PORT=6379
        volumes:
            - .:/var/www
            - ./storage/logs:/var/www/storage/logs
        depends_on:
            - db
            - redis
        networks:
            - findmy-network

    # Nginx web server
    nginx:
        image: nginx:alpine
        container_name: findmy-nginx
        ports:
            - "80:80"
            - "8000:80"
            - "443:443"
        volumes:
            - .:/var/www
            - ./docker/nginx/conf.d:/etc/nginx/conf.d
            - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./storage/logs/nginx:/var/log/nginx
        depends_on:
            - app
        networks:
            - findmy-network

    # MySQL Database
    db:
        image: mysql:8.0
        container_name: findmy-db
        environment:
            MYSQL_DATABASE: findmy
            MYSQL_USER: findmy_user
            MYSQL_PASSWORD: findmy_password
            MYSQL_ROOT_PASSWORD: root_password
            MYSQL_INITDB_SKIP_TZINFO: 1
        ports:
            - "3306:3306"
        volumes:
            - dbdata:/var/lib/mysql
            - ./storage/logs/mysql:/var/log/mysql
        networks:
            - findmy-network
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            timeout: 20s
            retries: 10

    # Redis Cache
    redis:
        image: redis:7-alpine
        container_name: findmy-redis
        ports:
            - "6379:6379"
        volumes:
            - redisdata:/data
        networks:
            - findmy-network
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            timeout: 3s
            retries: 5

    # phpMyAdmin for database management
    phpmyadmin:
        image: phpmyadmin:latest
        container_name: findmy-phpmyadmin
        environment:
            PMA_HOST: db
            PMA_USER: findmy_user
            PMA_PASSWORD: findmy_password
            PMA_ROOT_PASSWORD: root_password
        ports:
            - "8080:80"
        depends_on:
            - db
        networks:
            - findmy-network

volumes:
    dbdata:
        driver: local
    redisdata:
        driver: local

networks:
    findmy-network:
        driver: bridge
